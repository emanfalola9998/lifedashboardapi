include "local.conf"

# Database — defaults for local dev; Railway sets DB_JDBC_URL + DB_USERNAME + DB_PASSWORD
db.default.driver   = org.postgresql.Driver
db.default.url      = "jdbc:postgresql://ep-wandering-pine-ab2tp5x7.eu-west-2.aws.neon.tech/neondb?sslmode=require"
db.default.url      = ${?DB_JDBC_URL}
db.default.username = "neondb_owner"
db.default.username = ${?DB_USERNAME}
db.default.password = ${?DB_PASSWORD}

# App secret — Railway must set APPLICATION_SECRET
play.http.secret.key = "changeme-dev-only"
play.http.secret.key = ${?APPLICATION_SECRET}

# Return JSON (not HTML) for all unhandled errors, and log them
play.http.errorHandler = "errors.JsonErrorHandler"

# CORS — set FRONTEND_URL in Railway to the Vercel URL
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  allowedOrigins    = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization"]
}

# Disable CSRF for API (stateless)
play.filters.disabled += "play.filters.csrf.CSRFFilter"


# Allowed hosts
play.filters.hosts {
  allowed = [".onrender.com", "localhost:9000", "localhost"]
}

# Internal API secret — must be set via INTERNAL_API_SECRET env var in production
# local.conf supplies a dev value; production startup fails if the env var is absent
internal.apiSecret = ${?INTERNAL_API_SECRET}

# Thread pool for blocking JDBC calls, so they never tie up Play's request-handling threads.
# Sized to HikariCP's default maximumPoolSize (10) — more threads than connections would just wait.
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 10
  }
}

# Evolutions
play.evolutions.autoApply = true
