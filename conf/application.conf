# Database
db.default.driver=org.postgresql.Driver
db.default.url="jdbc:postgresql://ep-wandering-pine-ab2tp5x7.eu-west-2.aws.neon.tech/neondb?sslmode=require"
db.default.username="neondb_owner"
db.default.password=${?DB_PASSWORD}

# CORS - allow requests from Next.js frontend
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  allowedOrigins = ["http://localhost:3000"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization"]
}

# Disable CSRF for API (we're stateless)
play.filters.disabled += "play.filters.csrf.CSRFFilter"

# Evolutions
play.evolutions.autoApply=true